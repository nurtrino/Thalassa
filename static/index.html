<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>THALASSA — an Aegean voyage of wits</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<script type="importmap">
{ "imports": { "three": "/static/vendor/three.module.min.js" } }
</script>
</head>
<body>

<div id="world"></div>

<!-- ── lobby / join ─────────────────────────────────────────────────────── -->
<div id="lobby" class="overlay">
  <div class="panel">
    <h1>THALASSA</h1>
    <p class="tag">Sail the isles · wager your wits · earn the laurels</p>
    <div id="joinForm">
      <input id="nameInput" maxlength="16" placeholder="Your name, captain" autocomplete="off">
      <button id="createBtn" class="big">CREATE VOYAGE</button>
      <div class="joinRow">
        <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off">
        <button id="joinBtn">JOIN</button>
      </div>
      <p id="lobbyErr" class="err"></p>
    </div>
    <div id="waitRoom" class="hidden">
      <p>Room code</p>
      <div id="roomCode" class="code"></div>
      <button id="copyLink" class="small">copy invite link</button>
      <ul id="lobbyPlayers"></ul>
      <button id="startBtn" class="big hidden">SET SAIL</button>
      <p id="waitMsg" class="tag">waiting for the host…</p>
    </div>
  </div>
</div>

<!-- ── in-game HUD ──────────────────────────────────────────────────────── -->
<div id="hud" class="hidden">
  <div id="players"></div>
  <div id="turnBanner"></div>
  <div id="dice" class="hidden">
    <div class="die" id="die1"><div class="cube"></div></div>
    <div class="die" id="die2"><div class="cube"></div></div>
  </div>
  <div id="tray"></div>
  <div id="toasts"></div>
  <div id="roomTag"></div>
</div>

<!-- ── question card ────────────────────────────────────────────────────── -->
<div id="qmodal" class="overlay hidden">
  <div class="qcard">
    <div id="qhead"><span id="qkind"></span><span id="qdomain"></span></div>
    <div id="qtimer"><div id="qtimerBar"></div></div>
    <p id="qtext"></p>
    <div id="qopts"></div>
    <p id="qnote"></p>
  </div>
</div>

<!-- ── modal for votes / oracle claim / winner ──────────────────────────── -->
<div id="modal" class="overlay hidden">
  <div class="panel" id="modalBody"></div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
