# Thalassa — Render Blueprint.
#
# One Python web service. The table lives in process memory → keep this at a
# single instance. TRIVIA_API_KEY is OPTIONAL (it only lifts the live trivia
# API's rate limit; without it the public endpoint and the bundled questions
# are used). If you set one, set it in the Render dashboard — it is a secret,
# never commit it.

services:
  - type: web
    name: thalassa
    runtime: python
    plan: starter
    # --ws-max-size: game messages are a few hundred bytes; refuse oversized
    # frames at the protocol layer (uvicorn's default is 16 MB).
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --ws-max-size 65536
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: TRIVIA_API_KEY     # the-trivia-api.com key (secret, set in dashboard)
        sync: false
